name: public-artifact-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Lint public code
        run: ruff check src tests execution tools additive_coexistence
      - name: Compile
        run: python -m compileall -q src tests execution tools additive_coexistence
      - name: Test
        run: pytest -q -p no:cacheprovider
      - name: Verify frozen aggregate evidence
        run: orgcate verify
      - name: Verify unified morphology evidence
        run: python tools/verify_unified_morphology_evidence.py
      - name: Verify separate additive coexistence evidence
        run: python additive_coexistence/verify.py
      - name: Assemble additive coexistence artifact
        run: python tools/assemble_additive_coexistence_artifact.py artifacts/additive_coexistence
      - name: Verify additive coexistence artifact completeness
        run: python tools/verify_additive_coexistence_artifact.py artifacts/additive_coexistence
      - name: Audit public release contents
        run: python tools/audit_public_release.py --allow-metadata-pending
      - name: Verify release environment
        run: orgcate doctor --json
      - name: Run end-to-end public demo
        run: orgcate demo --scenario sign-reversal --output artifacts/ci_demo
      - name: Analyze all nine situations on uploaded validation backbone
        run: >-
          orgcate acceptance
          --config configs/data_to_results_acceptance_v1.json
          --output artifacts/ci_acceptance
      - name: Verify downloadable analysis results
        run: python tools/verify_acceptance_artifacts.py artifacts/ci_acceptance
      - name: Run average-effect estimator comparison
        run: >-
          orgcate ate-comparison
          --config configs/ate_estimator_comparison_v1.json
          --output artifacts/ci_ate_comparison
      - name: Run panel fixed-effects comparison
        run: >-
          orgcate fixed-effects-comparison
          --config configs/fixed_effects_comparison_v1.json
          --output artifacts/ci_fixed_effects
      - name: Verify average-effect comparison results
        run: >-
          python tools/verify_average_effect_artifacts.py
          --ate artifacts/ci_ate_comparison
          --fixed-effects artifacts/ci_fixed_effects
      - name: Assemble complete analysis package
        run: >-
          python tools/assemble_complete_analysis_artifact.py
          --acceptance artifacts/ci_acceptance
          --ate artifacts/ci_ate_comparison
          --fixed-effects artifacts/ci_fixed_effects
          --additive artifacts/additive_coexistence
          --output artifacts/complete_analysis
      - name: Verify complete analysis package
        run: python tools/verify_complete_analysis_artifact.py artifacts/complete_analysis
      - name: Upload data-to-results acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: orgcate-data-to-results-${{ github.run_id }}
          path: artifacts/ci_acceptance/
          if-no-files-found: error
          retention-days: 14
      - name: Upload additive coexistence evidence package
        uses: actions/upload-artifact@v4
        with:
          name: orgcate-additive-coexistence-${{ github.run_id }}
          path: artifacts/additive_coexistence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload complete analysis package
        uses: actions/upload-artifact@v4
        with:
          name: orgcate-complete-analysis-${{ github.run_id }}
          path: artifacts/complete_analysis/
          if-no-files-found: error
          retention-days: 14

