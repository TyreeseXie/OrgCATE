[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orgcate-sim"
version = "0.1.0"
description = "DML and causal-forest methods for organizational treatment-effect heterogeneity"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "econml==0.17.0",
  "pyyaml>=6.0",
  "pyarrow>=14",
]

[project.scripts]
orgcate = "orgcate_sim.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
